[project]
name = "world-clipboard-vision"
version = "0.1.0"
description = "Point-prompted segmentation backend for World Clipboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "numpy>=2.2,<3",
  "opencv-python-headless==4.14.0.94",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
